    <style>
        /* firefox styling */

        @-moz-document url-prefix() {
            #canvasoptions {
                font-weight: normal;
            }
        }

        /*    mobile responsive    */

        @media only screen and (max-width: 900px) {
            #canvasoptions {
                width: 100% !important;
                margin-left: 0px !important;
                font-size: 10px;
            }

            #animatedBackground2 {
                background-size: 30% !important;
            }
        }

        /*    main styling    */
        * {
            box-sizing: border-box;
        }

        canvas {
            border: 1px solid black;
            cursor: crosshair;
            box-shadow: black 0px 0px 10px;

        }

        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding-right: 10px;
            padding-left: 10px;

        }

        .image-container {
            border: 2px solid #ccc;
            padding: 5px;
            border-radius: 6px;
            max-width: 200px;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;


        }

        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        p {

            font-size: 13px !important;
            line-height: 10px;
        }

        .stroke_color {
            width: 32px;
            height: 32px;
            border-radius: 5px;
            margin-right: 5px;
            margin-left: 5px;
            outline: 3px solid #003759;
            display: inline-block;
            align-items: center !important;
            margin-bottom: 8px;

            &:hover {
                outline: 3px solid white !important;
                transition: 0.3s;
                cursor: pointer;
            }

            &:active {
                transform: scale(1.2);
            }
        }

        .colorPalette {
            display: none;


            margin-top: 5px;
            width: 100%;
            flex-wrap: wrap;


        }

        /*    range slider styling    */

        input[type=range] {
            width: 150px;
            margin: 3px 0;
            background-color: transparent;
            -webkit-appearance: none;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            background: #003759;
            border: 0;
            border-radius: 25px;
            width: 100%;
            height: 10px;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            margin-top: -5px;
            width: 34px;
            height: 20px;
            background: #2d7ba6;
            border: 3px solid #00243b;
            border-radius: 5px;
            cursor: pointer;
            -webkit-appearance: none;
        }

        input[type=range]:focus::-webkit-slider-runnable-track {
            background: #004069;
        }

        input[type=range]::-moz-range-track {
            background: #003759;
            border: 0;
            border-radius: 25px;
            width: 100%;
            height: 8px;
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb {
            width: 34px;
            height: 16px;
            background: #2d7ba6;
            border: 3px solid #00243b;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type=range]::-ms-track {
            background: transparent;
            border-color: transparent;
            border-width: 6px 0;
            color: transparent;
            width: 100%;
            height: 10px;
            cursor: pointer;
        }

        input[type=range]::-ms-fill-lower {
            background: #00080d;
            border: 0;
            border-radius: 50px;
        }

        input[type=range]::-ms-fill-upper {
            background: #00243b;
            border: 0;
            border-radius: 50px;
        }

        input[type=range]::-ms-thumb {
            width: 34px;
            height: 20px;
            background: #00568c;
            border: 3px solid #00243b;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 0px;
            /*Needed to keep the Edge thumb centred*/
        }

        input[type=range]:focus::-ms-fill-lower {
            background: #00243b;
        }

        input[type=range]:focus::-ms-fill-upper {
            background: #004069;
        }

        /*TODO: Use one of the selectors from https://stackoverflow.com/a/20541859/7077589 and figure out
how to remove the virtical space around the range input in IE*/
        @supports (-ms-ime-align:auto) {

            /* Pre-Chromium Edge only styles, selector taken from hhttps://stackoverflow.com/a/32202953/7077589 */
            input[type=range] {
                margin: 0;
                /*Edge starts the margin from the thumb, not the track as other browsers do*/
            }
        }



        .theword {
            color: red;
        }
